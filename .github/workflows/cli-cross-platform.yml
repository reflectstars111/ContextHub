name: ContextHub CLI across platforms

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check Git for temporary Hub integration tests
        run: git --version
      - name: Test all commands, native Windows behavior and Hub regressions
        run: python scripts/verify_release.py
      - name: Verify draft save and account-change races
        run: node scripts/verify_draft_races.js
      - name: Build CLI artifact
        run: python -m contexthub.distribution --output ctx.pyz
      - name: Run archive outside the checkout
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile
          archive = pathlib.Path('ctx.pyz').resolve()
          with tempfile.TemporaryDirectory() as cwd:
              subprocess.run([sys.executable, str(archive), '--version'], cwd=cwd, check=True)
