# Install as ~/.config/systemd/user/contexthub.service.d/public.conf.
# Replace the hostname. Inherits WorkingDirectory/data location from the base unit.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 -m contexthub serve --data .context-data --host 127.0.0.1 --port 8765 --public-url https://contexthub.example.com --trust-cloudflare --max-connections 4 --max-body-mib 16 --request-deadline 120 --max-storage-mib 5120 --min-free-mib 5120
MemoryHigh=512M
MemoryMax=1G
CPUQuota=100%
TasksMax=64
